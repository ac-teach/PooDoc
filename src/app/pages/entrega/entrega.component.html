<section
  id="entrega"
  class="rounded-xl border border-border-subtle bg-surface-container-lowest p-space-lg shadow-sm"
>
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-2xl font-semibold text-primary">Entrega final</h2>
      <p class="mt-1 text-sm text-outline">Tu entrega demuestra el proceso completo.</p>
    </div>
    <span class="mono rounded-full bg-secondary-fixed px-2 py-1 text-[11px] text-secondary"
      >INDIVIDUAL</span
    >
  </div>

  <div class="mt-4 grid gap-3 md:grid-cols-2">
    @for (card of cards; track card.name) {
      <div
        class="rounded-lg border border-border-subtle bg-surface-subtle p-4 {{ card.span ? 'md:col-span-2' : '' }}"
      >
        <h3 class="font-medium text-primary">{{ card.name }}</h3>
        <ul class="mt-2 list-none space-y-1 text-sm text-on-surface-variant">
          @for (item of card.items; track $index) {
            <li>
              <span class="mr-0.5">•</span>
              @for (seg of item; track $index) {
                @if (seg.c) {
                  <code>{{ seg.c }}</code>
                } @else {
                  <span>{{ seg.t }}</span>
                }
              }
            </li>
          }
        </ul>
      </div>
    }
  </div>
</section>
