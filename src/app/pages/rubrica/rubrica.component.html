<section
  id="rubrica"
  class="rounded-xl border border-border-subtle bg-surface-container-lowest p-space-lg shadow-sm"
>
  <div class="mb-4 flex items-center gap-2">
    <span class="material-symbols-outlined text-secondary-container">fact_check</span>
    <div>
      <h2 class="text-2xl font-semibold text-primary">Rúbrica propuesta · 100 puntos</h2>
      <p class="mt-1 text-sm text-outline">
        La evaluación privilegia comprensión y trazabilidad, no volumen de código.
      </p>
    </div>
  </div>

  <div class="overflow-x-auto rounded-lg border border-border-subtle">
    <table class="w-full text-sm">
      <thead class="bg-surface-subtle">
        <tr class="text-left mono text-[11px] text-primary">
          <th class="p-3">Criterio</th>
          <th class="p-3">Pts.</th>
          <th class="p-3">Evidencia</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-border-subtle">
        @for (row of rows; track row.criterion) {
          <tr>
            <td class="p-3 font-medium">{{ row.criterion }}</td>
            <td class="p-3 mono text-secondary">{{ row.pts }}</td>
            <td class="p-3 text-on-surface-variant">{{ row.evidence }}</td>
          </tr>
        }
      </tbody>
      <tfoot class="bg-primary text-white">
        <tr>
          <td class="p-3 font-semibold">Total</td>
          <td class="p-3 mono font-semibold">100</td>
          <td class="p-3 text-inverse-on-surface">Comprender, construir, probar y explicar.</td>
        </tr>
      </tfoot>
    </table>
  </div>
</section>
